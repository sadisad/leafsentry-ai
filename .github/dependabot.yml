version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    # Upgrade the CPU torch/torchvision pair together in a tested change.
    # Version-only ignores do not suppress Dependabot security updates.
    ignore:
      - dependency-name: torch
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: torchvision
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    ignore:
      # Runtime support is intentionally Python 3.11-3.12; accept only 3.12 patch tags.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
