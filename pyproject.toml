[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafsentry-ai"
version = "0.1.0"
description = "Uncertainty-aware bean leaf image triage, built as a production AI engineering reference."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Irsyad Dzulfikar" }]
keywords = ["computer-vision", "mlops", "fastapi", "selective-prediction", "uncertainty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyio>=4.0,<5",
  "fastapi>=0.116,<1",
  "numpy>=2.0,<2.5",
  "pillow>=11.0,<13",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.18.0",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-Pillow>=10.2",
]

[project.scripts]
leafsentry = "leafsentry.cli:main"
leafsentry-api = "leafsentry.__main__:main"

[project.urls]
Homepage = "https://leafsentry.syd.my.id"
Demo = "https://leafsentry.syd.my.id"
Repository = "https://github.com/sadisad/leafsentry-ai"
Issues = "https://github.com/sadisad/leafsentry-ai/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leafsentry = ["static/*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["model: downloads and exercises the pinned production model"]

[tool.coverage.run]
branch = true
source = ["leafsentry"]
omit = ["src/leafsentry/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PIE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["leafsentry"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
